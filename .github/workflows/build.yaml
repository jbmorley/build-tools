name: build
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 14 * * 1'  # 04:00 Monday, HST.
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-26.04

    steps:

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Source-only smoke test
      run: scripts/smoke-test.sh

  keychain-test:
    runs-on: macos-latest

    env:

      MISE_CACHE_DIR: ${{ github.workspace }}/.mise/cache
      MISE_CONFIG_DIR: ${{ github.workspace }}/.mise/config
      MISE_DATA_DIR: ${{ github.workspace }}/.mise/data
      MISE_STATE_DIR: ${{ github.workspace }}/.mise/state

    steps:

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Cache mise
      id: cache-mise
      uses: actions/cache@v6
      with:
        path: .mise
        key: ${{ runner.os }}-${{ runner.arch }}-mise--${{ hashFiles('mise.toml') }}

    - name: Install mise
      uses: jdx/mise-action@v5.1.1
      with:
        version: 2026.9.10
        cache: false

    - name: Test the create-keychain command
      run: scripts/test-keychain.sh

  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      needs_release: ${{ steps.build.outputs.needs_release }}

    env:

      MISE_CACHE_DIR: ${{ github.workspace }}/.mise/cache
      MISE_CONFIG_DIR: ${{ github.workspace }}/.mise/config
      MISE_DATA_DIR: ${{ github.workspace }}/.mise/data
      MISE_STATE_DIR: ${{ github.workspace }}/.mise/state

    steps:

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Cache mise
      id: cache-mise
      uses: actions/cache@v6
      with:
        path: .mise
        key: ${{ runner.os }}-${{ runner.arch }}-mise--${{ hashFiles('mise.toml') }}

    - name: Install mise
      uses: jdx/mise-action@v5.1.1
      with:
        version: 2026.9.10
        cache: false

    - id: build
      name: Build the package
      run: scripts/build.sh

    - name: Store the distribution packages
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/

    - name: Test wheel
      run: scripts/test-wheel.sh

    - name: Create release
      run: scripts/release.sh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: ${{ github.ref == 'refs/heads/main' }}

  publish-to-pypi:
    if: ${{ (github.ref == 'refs/heads/main') && (needs.build.outputs.needs_release == 'true') }}
    needs:
    - build
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/p/inseven-build-tools
    permissions:
      id-token: write
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
